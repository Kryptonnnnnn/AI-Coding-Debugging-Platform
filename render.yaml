# Render Blueprint: backend web service + free PostgreSQL.
# NOTE: Render's free Postgres expires after 30 days; use Neon/Supabase for a permanent free DB (see README).
services:
  - type: web
    name: aicp-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: aicp-db, property: connectionString }
      - key: AI_PROVIDER
        value: mock            # switch to groq after adding GROQ_API_KEY
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false            # set to your Vercel URL
      - key: EXECUTION_ENABLED
        value: "false"
databases:
  - name: aicp-db
    plan: free
