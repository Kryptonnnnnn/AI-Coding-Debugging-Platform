# Render Blueprint: backend web service only. The database lives on Neon (Render's free Postgres expires after 30 days).
# Values marked `sync: false` are entered once in the Render dashboard and never stored in Git.
services:
  - type: web
    name: aicp-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # --proxy-headers: Render terminates TLS, so trust X-Forwarded-For to rate-limit real client IPs.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon connection string
      - key: CORS_ORIGINS
        sync: false          # exact Vercel origin, e.g. https://your-app.vercel.app (no trailing slash)
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: EXECUTION_ENABLED
        value: "false"
